name: Tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: dotnet restore Go.Tests/Go.Tests.csproj

      - name: Build
        run: msbuild Go.csproj -t:Build -p:Configuration=Debug -verbosity:minimal

      - name: Run tests
        run: dotnet test Go.Tests/Go.Tests.csproj --no-restore --verbosity normal
