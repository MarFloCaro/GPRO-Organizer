name: Test Forum Notification

on:
  workflow_dispatch:

jobs:
  test-post:
    runs-on: ubuntu-latest
    environment: build-release

    steps:
      - name: Send test forum post
        shell: pwsh
        env:
          API_GPRO_FORUM_TOPIC_ENDPOINT: ${{ vars.API_GPRO_FORUM_TOPIC_ENDPOINT }}
          FLO_API_TOKEN : ${{ secrets.FLO_API_TOKEN }}
          GO_FORUM_TOPIC_ID: ${{ vars.GO_FORUM_TOPIC_ID }}
        run: |
          $message = @"
          [table][trow][th][b][size=+2][color=yellow]New GPRO Organizer release available: v4.0.0.0[/color][/size][/b][/th][/trow][/table]

          [b][u][size=+1]Download:[/size][/u][/b]
          [table][trow][th][b][size=+1] https://github.com/${{ github.repository }}/releases/latest [/size][/b][/th][/trow][/table]

          "@

          $headers = @{
            Authorization = "Bearer $env:FLO_API_TOKEN"
          }

          $body = @{
            TopicId = $env:GO_FORUM_TOPIC_ID
            bodyShow = $message
          }

          Invoke-RestMethod `
            -Uri $env:API_GPRO_FORUM_TOPIC_ENDPOINT `
            -Method Post `
            -Headers $headers `
            -Body $body