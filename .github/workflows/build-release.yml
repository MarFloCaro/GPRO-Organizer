name: Build and Release GO

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2025-vs2026
    environment: build-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore Go.sln

      - name: Build solution
        run: msbuild Go.sln /p:Configuration=Release

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path bin\Release\* -DestinationPath GPRO-Organizer-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: GPRO Organizer ${{ github.ref_name }}
          files: GPRO-Organizer-${{ github.ref_name }}.zip

      - name: Post forum notification
        if: success()
        shell: pwsh
        continue-on-error: true
        env:
          FORUM_GO_TOPIC_URL: ${{ vars.API_GPRO_FORUM_TOPIC_ENDPOINT }}
          FORUM_API_TOKEN: ${{ secrets.FLO_API_TOKEN }}
          FORUM_TOPIC_ID: ${{ vars.GO_FORUM_TOPIC_ID }}
        run: |
          $message = @"
          New GPRO Organizer release available: v${env:VERSION}

          Download:
          https://github.com/${{ github.repository }}/releases/latest
          "@

          $headers = @{
            Authorization = "Bearer $env:FLO_API_TOKEN"
          }

          $body = @{
            TopicId = $env:GO_FORUM_TOPIC_ID
            bodyShow = $message
          }

          Invoke-RestMethod `
            -Uri $env:API_GPRO_FORUM_TOPIC_ENDPOINT `
            -Method Post `
            -Headers $headers `
            -Body $body